services:
  web:
    build: .
    container_name: custom_rss_web
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-custom_rss}
      - DB_USER=${DB_USER:-custom_rss}
      - DB_PASSWORD=${DB_PASSWORD:-custom_rss_password}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-admin123456}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      - RSS_FEED_LIMIT=${RSS_FEED_LIMIT:-50}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - static_volume:/app/staticfiles
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "120"]

  db:
    image: postgres:16-alpine
    container_name: custom_rss_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-custom_rss}
      - POSTGRES_USER=${DB_USER:-custom_rss}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-custom_rss_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-custom_rss} -d ${DB_NAME:-custom_rss}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  static_volume:
