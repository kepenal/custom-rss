services:
  web:
    build: .
    container_name: custom_rss_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - static_volume:/app/staticfiles

  db:
    image: postgres:16-alpine
    container_name: custom_rss_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-custom_rss}
      - POSTGRES_USER=${DB_USER:-custom_rss}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-custom_rss_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-custom_rss} -d ${DB_NAME:-custom_rss}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  static_volume:
