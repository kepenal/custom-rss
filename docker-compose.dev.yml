services:
  web:
    build: .
    container_name: custom_rss_dev_web
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - .:/app
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  db:
    image: postgres:16-alpine
    container_name: custom_rss_dev_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-custom_rss_dev}
      - POSTGRES_USER=${DB_USER:-custom_rss_dev}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-custom_rss_dev_password}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-custom_rss_dev} -d ${DB_NAME:-custom_rss_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
