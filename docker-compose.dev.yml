services:
  web:
    build: .
    container_name: custom_rss_dev_web
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - ALLOWED_HOSTS=crss.armaganuzun.com,localhost,127.0.0.1,0.0.0.0
      - CSRF_TRUSTED_ORIGINS=https://crss.armaganuzun.com,http://localhost:8000,http://127.0.0.1:8000
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-custom_rss_dev}
      - DB_USER=${DB_USER:-custom_rss_dev}
      - DB_PASSWORD=${DB_PASSWORD:-custom_rss_dev_password}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-admin}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@dev.local}
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  db:
    image: postgres:16-alpine
    container_name: custom_rss_dev_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-custom_rss_dev}
      - POSTGRES_USER=${DB_USER:-custom_rss_dev}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-custom_rss_dev_password}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-custom_rss_dev} -d ${DB_NAME:-custom_rss_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
