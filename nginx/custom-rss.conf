# Nginx Reverse Proxy Yapılandırması - crss.armaganuzun.com
# /etc/nginx/sites-available/custom-rss

# ?key= parametresinin access log'a açık düşmesini engellemek için maskelenmiş log formatı:
map $request_uri $sanitized_request_uri {
    ~*(?P<path>[^?]+)\?.*key=[^&]+(?P<rest>.*) $path?key=[REDACTED]$rest;
    default $request_uri;
}

log_format custom_rss_combined '$remote_addr - $remote_user [$time_local] '
                               '"$request_method $sanitized_request_uri $server_protocol" '
                               '$status $body_bytes_sent "$http_referer" '
                               '"$http_user_agent"';

server {
    listen 80;
    server_name crss.armaganuzun.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crss.armaganuzun.com;

    ssl_certificate /etc/letsencrypt/live/crss.armaganuzun.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crss.armaganuzun.com/privkey.pem;

    access_log /var/log/nginx/custom_rss_access.log custom_rss_combined;
    error_log /var/log/nginx/custom_rss_error.log;

    client_max_body_size 10M;

    # Django statik dosyaları
    location /static/ {
        alias /var/www/custom-rss/staticfiles/;
        expires 30d;
        access_log off;
    }

    # n8n Yazma API'si ve RSS Akışları
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
